<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentist Tracker — Support</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A1628;
            color: #E2E8F0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #1A2744;
            border-radius: 16px;
            padding: 48px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            text-align: center;
        }
        .icon { font-size: 56px; margin-bottom: 16px; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #fff; }
        .subtitle { color: #94A3B8; font-size: 15px; margin-bottom: 36px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        a {
            display: block;
            background: #0F1D32;
            color: #60A5FA;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s;
        }
        a:hover { background: #1E3A5F; }
        .contact {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #2D3F5E;
            font-size: 13px;
            color: #64748B;
        }
        .contact a { display: inline; background: none; padding: 0; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🦷</div>
        <h1>Dentist Tracker</h1>
        <p class="subtitle">Smart Dental Practice Management</p>
        <div class="links">
            <a href="privacy-policy.html">📋 Privacy Policy</a>
            <a href="delete-account.html">🗑️ Delete Account & Data</a>
        </div>
        <div class="contact">
            <p>Contact: <a href="mailto:support@hiretrack.ink">support@hiretrack.ink</a></p>
            <p style="margin-top: 6px;">© 2026 Dentist Tracker. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
